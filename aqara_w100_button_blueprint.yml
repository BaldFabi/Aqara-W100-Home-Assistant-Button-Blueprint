mode: restart
blueprint:
  name: Aqara W100 Button Blueprint
  author: BaldFabi
  description: This blueprint makes it easy to define any kind of actions for the 3 buttons on the Aqara W100
  domain: automation
  source_url: https://raw.githubusercontent.com/BaldFabi/Aqara-W100-Home-Assistant-Button-Blueprint/refs/heads/master/aqara_w100_button_blueprint.yml
  homeassistant:
    min_version: 2026.08.0

  input:
    setup:
      name: Button Setup
      description: Select the event entities of the Aqara W100 buttons
      collapsed: true
      input:
        plus_button_event:
          name: Entity
          description: Entity for the plus (+) button
          selector: &button_event_selector
            entity:
              multiple: true
              filter:
                domain: event
                device_class: button

        neutral_button_event:
          name: Entity
          description: Entity for the neutral (no icon) button
          selector: *button_event_selector

        minus_button_event:
          name: Entity
          description: Entity for the minus (-) button
          selector: *button_event_selector

    plus_button:
      name: Plus (+) Button Actions
      description: Define actions when pressing the plus (+) button
      collapsed: true
      input:
        plus_button_single:
          name: Single Press
          description: Action for single press
          default: []
          selector:
            action: {}

        plus_button_double:
          name: Double Press
          description: Action for double press
          default: []
          selector:
            action: {}

        plus_button_long_press:
          name: Long Press (on press)
          description: Action for long press completion
          default: []
          selector:
            action: {}

        plus_button_long_release:
          name: Long Press (on release)
          description: Action for long press completion
          default: []
          selector:
            action: {}

        plus_button_holding_interval:
          name: Holding Interval
          description: Interval in seconds for repeating "while holding" actions
          default: 0.2
          selector:
            number:
              min: 0.05
              max: 2
              step: 0.05

        plus_button_holding_max_iterations:
          name: Holding Max Iterations
          description: Maximum number of iterations for "while holding" actions (this prevents infinite loops)
          default: 100
          selector:
            number:
              min: 1
              max: 1000
              step: 1

        plus_button_while_holding:
          name: While Holding
          description: Action while holding. This action will be repeated at the defined interval while the button is held down
          default: []
          selector:
            action: {}

    neutral_button:
      name: Neutral Button Actions
      description:
      description: Define actions when pressing the neutral button
      collapsed: true
      input:
        neutral_button_single:
          name: Single Press
          description: Action for single press
          default: []
          selector:
            action: {}

        neutral_button_double:
          name: Double Press
          description: Action for double press
          default: []
          selector:
            action: {}

        neutral_button_long_press:
          name: Long Press (on press)
          description: Action for long press completion
          default: []
          selector:
            action: {}

        neutral_button_long_release:
          name: Long Press (on release)
          description: Action for long press completion
          default: []
          selector:
            action: {}

        neutral_button_holding_interval:
          name: Holding Interval (seconds)
          description: Interval in seconds for repeating "while holding" actions
          default: 0.2
          selector:
            number:
              min: 0.05
              max: 2
              step: 0.05

        neutral_button_holding_max_iterations:
          name: Holding Max Iterations
          description: Maximum number of iterations for "while holding" actions (this prevents infinite loops)
          default: 100
          selector:
            number:
              min: 1
              max: 1000
              step: 1

        neutral_button_while_holding:
          name: While Holding
          description: Action while holding. This action will be repeated at the defined interval while the button is held down
          default: []
          selector:
            action: {}

    button3:
      name: Minus (-) Button Actions
      description: Define actions when pressing the minus (-) button
      collapsed: true
      input:
        minus_button_single:
          name: Single Press
          description: Action for single press
          default: []
          selector:
            action: {}

        minus_button_double:
          name: Double Press
          description: Action for double press
          default: []
          selector:
            action: {}

        minus_button_long_press:
          name: Long Press (on press)
          description: Action for long press completion
          default: []
          selector:
            action: {}

        minus_button_long_release:
          name: Long Press (on release)
          description: Action for long press completion
          default: []
          selector:
            action: {}

        minus_button_holding_interval:
          name: Holding Interval (seconds)
          description: Interval in seconds for repeating "while holding" actions
          default: 0.2
          selector:
            number:
              min: 0.05
              max: 2
              step: 0.05

        minus_button_holding_max_iterations:
          name: Holding Max Iterations
          description: Maximum number of iterations for "while holding" actions (this prevents infinite loops)
          default: 100
          selector:
            number:
              min: 1
              max: 1000
              step: 1

        minus_button_while_holding:
          name: While Holding
          description: Action while holding. This action will be repeated at the defined interval while the button is held down
          default: []
          selector:
            action: {}

trigger:
  - platform: state
    id: plus_button
    entity_id: !input plus_button_event
  - platform: state
    id: neutral_button
    entity_id: !input neutral_button_event
  - platform: state
    id: minus_button
    entity_id: !input minus_button_event

condition:
  - condition: template
    value_template: >
      {{ trigger.from_state.state not in ['unknown', 'unavailable'] }}
  - condition: template
    value_template: >
      {{ trigger.to_state.state not in ['unknown', 'unavailable'] }}
  - condition: template
    value_template: >
      {{ trigger.from_state.state != trigger.to_state.state }}

action:
  - variables:
      trigger_id: "{{ trigger.id }}"
      press_type: "{{ trigger.to_state.attributes.event_type }}"
      plus_button_max_iterations: !input plus_button_holding_max_iterations
      neutral_button_max_iterations: !input neutral_button_holding_max_iterations
      minus_button_max_iterations: !input minus_button_holding_max_iterations

  - parallel:
      - repeat:
          while:
            - condition: template
              value_template: >
                {{ press_type == 'long_press' and trigger_id == 'plus_button' and states(trigger.entity_id) == trigger.to_state.state }}
            - condition: template
              value_template: >
                {{ repeat.index | default(0) <= plus_button_max_iterations }}
          sequence:
            - sequence: !input plus_button_while_holding
            - delay:
                seconds: !input plus_button_holding_interval

      - repeat:
          while:
            - condition: template
              value_template: >
                {{ press_type == 'long_press' and trigger_id == 'neutral_button' and states(trigger.entity_id) == trigger.to_state.state }}
            - condition: template
              value_template: >
                {{ repeat.index | default(0) <= neutral_button_max_iterations }}
          sequence:
            - sequence: !input neutral_button_while_holding
            - delay:
                seconds: !input neutral_button_holding_interval

      - repeat:
          while:
            - condition: template
              value_template: >
                {{ press_type == 'long_press' and trigger_id == 'minus_button' and states(trigger.entity_id) == trigger.to_state.state }}
            - condition: template
              value_template: >
                {{ repeat.index | default(0) <= minus_button_max_iterations }}
          sequence:
            - sequence: !input minus_button_while_holding
            - delay:
                seconds: !input minus_button_holding_interval

      - choose:
          # Actions for plus (+) button
          - conditions:
              - condition: template
                value_template: >
                  {{ trigger_id == 'plus_button' and press_type == 'multi_press_1' }}
            sequence: !input plus_button_single

          - conditions:
              - condition: template
                value_template: >
                  {{ trigger_id == 'plus_button' and press_type == 'multi_press_2' }}
            sequence: !input plus_button_double

          - conditions:
              - condition: template
                value_template: >
                  {{ trigger_id == 'plus_button' and press_type == 'long_press' }}
            sequence: !input plus_button_long_press

          - conditions:
              - condition: template
                value_template: >
                  {{ trigger_id == 'plus_button' and press_type == 'long_release' }}
            sequence: !input plus_button_long_release

          # Actions for neutral button
          - conditions:
              - condition: template
                value_template: >
                  {{ trigger_id == 'neutral_button' and press_type == 'multi_press_1' }}
            sequence: !input neutral_button_single

          - conditions:
              - condition: template
                value_template: >
                  {{ trigger_id == 'neutral_button' and press_type == 'multi_press_2' }}
            sequence: !input neutral_button_double

          - conditions:
              - condition: template
                value_template: >
                  {{ trigger_id == 'neutral_button' and press_type == 'long_press' }}
            sequence: !input neutral_button_long_press

          - conditions:
              - condition: template
                value_template: >
                  {{ trigger_id == 'neutral_button' and press_type == 'long_release' }}
            sequence: !input neutral_button_long_release

          # Actions for minus (-) button
          - conditions:
              - condition: template
                value_template: >
                  {{ trigger_id == 'minus_button' and press_type == 'multi_press_1' }}
            sequence: !input minus_button_single

          - conditions:
              - condition: template
                value_template: >
                  {{ trigger_id == 'minus_button' and press_type == 'multi_press_2' }}
            sequence: !input minus_button_double

          - conditions:
              - condition: template
                value_template: >
                  {{ trigger_id == 'minus_button' and press_type == 'long_press' }}
            sequence: !input minus_button_long_press

          - conditions:
              - condition: template
                value_template: >
                  {{ trigger_id == 'minus_button' and press_type == 'long_release' }}
            sequence: !input minus_button_long_release
